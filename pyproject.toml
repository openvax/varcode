[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "varcode"
requires-python = ">=3.11"
authors = [{name = "Alex Rubinsteyn", email = "alex.rubinsteyn@unc.edu"}]
description = "Variant annotation in Python"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = {attr = "varcode.version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["varcode", "varcode.*"]

[tool.setuptools.package-data]
"varcode.cli" = ["logging.conf"]
"varcode" = ["data/*.json", "py.typed"]

[project.urls]
"Homepage" = "https://github.com/openvax/varcode"
"Bug Tracker" = "https://github.com/openvax/varcode/issues"

[project.optional-dependencies]
# pysam stays optional: it has no Windows build, and only
# RNAReadPhasingSource (RNA-seq read phasing) uses it.
rna = ["pysam>=0.21"]

[project.scripts]
varcode-genes = "varcode.cli.genes_script:main"
varcode = "varcode.cli.main:main"

[dependency-groups]
# For working on Varcode, not for using it, so these are not published as
# extras (PEP 735). With pip 25.1+: pip install -e '.[rna]' --group test --group lint
test = [
    "osteosarc>=0.14.4,<0.16",  # patient-data fixtures
    "biotite>=1.6",  # independent sequence checks
    "pysam>=0.21",  # RNA read phasing tests
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]
lint = ["ruff", "mypy==2.4.0", "pandas-stubs==3.0.5.260914"]

[tool.pytest.ini_options]
markers = [
    "parity: fast vs protein_diff byte-for-byte parity harness (tests/test_protein_diff_parity.py). Runs by default; also selectable with `pytest -m parity`.",
]
# Test genomes have no chromosome FASTA, and this warning fires once per
# genome in whichever test reaches it first. tests/test_genome_sequence.py
# checks the warning itself.
filterwarnings = [
    "ignore:cryptic_exons. no reference sequence:UserWarning",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F841", "E731", "E741", "E722", "E721"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test*/*" = ["F401"]

# Gradual adoption: check the input/comparison APIs and their function bodies.
# Imported legacy modules and third-party packages without stubs remain gradual.
[tool.mypy]
python_version = "3.11"
files = [
    "varcode/effect_traversal.py",
    "varcode/effect_candidates.py",
    "varcode/contigs.py",
    "varcode/nucleotides.py",
    "varcode/reference.py",
    "varcode/variant.py",
    "varcode/annotators/__init__.py",
    "varcode/annotators/registry.py",
    "varcode/variant_collection.py",
    "varcode/effects/effect_collection.py",
    "varcode/vcf.py",
    "varcode/sv_allele_parser.py",
    "varcode/maf.py",
    "varcode/proteome.py",
    "tests/typing/api_inputs.py",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["varcode", "varcode.*"]
implicit_reexport = false
