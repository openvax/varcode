# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

# TODO:
# - update coveralls
# - get a badge for tests passing
# - download binary dependencies from conda
name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: "3.9"
            pandas: "pandas>=2.2.2,<3"
            gtfparse: "gtfparse>=3.0.2,<4"
          - python-version: "3.10"
            pandas: "pandas>=2.2.2,<3"
            gtfparse: "gtfparse>=3.0.2,<4"
          - python-version: "3.11"
            pandas: "pandas>=2.2.2,<3"
            gtfparse: "gtfparse>=3.0.2,<4"
          - python-version: "3.11"
            pandas: "pandas>=3,<4"
            gtfparse: "gtfparse>=3.0.2,<4"
          - python-version: "3.12"
            pandas: "pandas>=3,<4"
            gtfparse: "gtfparse>=3.0.2,<4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        env:
          PANDAS_REQUIREMENT: ${{ matrix.pandas }}
          GTFPARSE_REQUIREMENT: ${{ matrix.gtfparse }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest pytest-cov coveralls ruff build 'setuptools>=64'
          python -m pip install -r requirements.txt "$PANDAS_REQUIREMENT" "$GTFPARSE_REQUIREMENT"
      - name: Verify, build and install the source distribution
        run: |
          python -m pytest -q tests/test_source_distribution.py
          python -m build --sdist --outdir "$RUNNER_TEMP/varcode-dist"
          mkdir "$RUNNER_TEMP/varcode-sdist"
          tar -xzf "$RUNNER_TEMP"/varcode-dist/varcode-*.tar.gz --strip-components=1 -C "$RUNNER_TEMP/varcode-sdist"
          # The supported Osteosarc range covers this Python matrix;
          # run native adapter checks against the bundled historical snapshot.
          python -m pip install "$RUNNER_TEMP/varcode-sdist[test-data,uorf]"
          python -m pip check
          python -m pip show pandas pyensembl gtfparse
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run default linting script
        run: |
          ./lint.sh
      # Cache the pyensembl downloads — fetching all four releases
      # uncached takes ~5 minutes per matrix job. The key encodes:
      #   - the exact release tags below (auto-invalidates if a
      #     release is added/changed)
      #   - the requirements.txt hash (auto-invalidates if pyensembl
      #     is bumped to a version with a different on-disk layout)
      # Bump the trailing -vN suffix to force a refresh for other
      # reasons.
      - name: Cache pyensembl releases
        id: pyensembl-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pyensembl
          # PyEnsembl 2.27.5 keys downloads and indexes by their source URL.
          key: pyensembl-${{ runner.os }}-grch37.75-grch38.81-grch38.95-grcm38.95-${{ hashFiles('requirements.txt') }}-v3
      - name: Install Ensembl data
        run: |
          echo "Before installing Ensembl releases" && df -h
          # pyensembl install is idempotent — when the cache hit
          # restores the data, these commands just verify and exit.
          # Use the same canonical sources as EnsemblRelease in the tests.
          # Mirror URLs have distinct cache identities (openvax/pyensembl#470).
          pyensembl install --release 75 --species human
          pyensembl install --release 81 --species human
          pyensembl install --release 95 --species human
          pyensembl install --release 95 --species mouse
          echo "After installing Ensembl releases" && df -h
      - name: Run unit tests from the source distribution
        working-directory: ${{ runner.temp }}/varcode-sdist
        run: |
          ./test.sh --cov-report=xml:coverage.xml
      # Experimental annotators may decline inputs. Compare protein_diff on
      # the shared point-edit domain; the full suite above separately checks
      # SV refusal, partial plugins, and explicit dual-annotator regressions.
      - name: Cross-annotator parity gate (shared point-edit domain)
        if: matrix.python-version == '3.11' && matrix.pandas == 'pandas>=3,<4'
        working-directory: ${{ runner.temp }}/varcode-sdist
        env:
          COVERAGE_FILE: .coverage.parity
        run: |
          ./test.sh --annotator=protein_diff -m parity
      - name: Publish coverage to Coveralls
        uses: coverallsapp/github-action@v2.3.6
        with:
          parallel: true
          file: ${{ runner.temp }}/varcode-sdist/coverage.xml
          base-path: ${{ runner.temp }}/varcode-sdist
