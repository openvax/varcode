site_name: varcode
site_description: Library for manipulating genomic variants and predicting their effects
site_url: https://openvax.github.io/varcode/
repo_url: https://github.com/openvax/varcode
repo_name: openvax/varcode
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Everyday tasks:
      - Effect annotation: effect_annotation.md
      - Genotypes & sample queries: genotype.md
      - Saving & reloading results: csv.md
      - Troubleshooting: errors.md
  - Advanced workflows:
      - Splice variants: splice_variants.md
      - Structural variants & RNA: structural_variants.md
      - Germline-aware annotation: germline.md
      - VariantCollection transforms: transforms.md
      - Experimental annotators: experimental_annotators.md
  - Reference:
      - Transcript models: transcript_models.md
      - Effect types: effect_types.md
      - API reference: api.md
      - Writing an annotator: annotator_contract.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
  - pymdownx.superfences
  - tables

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            members_order: source
            docstring_style: numpy
            docstring_section_style: spacy
            merge_init_into_class: true
