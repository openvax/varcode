site_name: varcode
site_description: Library for manipulating genomic variants and predicting their effects
site_url: https://openvax.github.io/varcode/
repo_url: https://github.com/openvax/varcode
repo_name: openvax/varcode
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - Everyday tasks:
      - Effect annotation: effect_annotation.md
      - Genotypes & sample queries: genotype.md
      - Sample identity checks: sample_identity.md
      - Saving & reloading results: csv.md
      - Protein collections & FASTA: proteome.md
      - Troubleshooting: errors.md
  - Advanced workflows:
      - Native mouse, dog & T2T references: native_references.md
      - Splice variants: splice_variants.md
      - Structural variants: structural_variants.md
      - Comparing SV callers: sv_comparison.md
      - Observed RNA imports: rna_structures.md
      - Germline-aware annotation: germline.md
      - Phasing: phasing.md
      - VariantCollection transforms: transforms.md
      - ncORF annotation with ORFdata: uorf_annotations.md
      - Annotation pipeline and compatibility: experimental_annotators.md
  - Reference:
      - Varcode, Isovar & Vaxrank: library_roles.md
      - Transcript models: transcript_models.md
      - SV coordinates & fusion rules: sv_reference.md
      - Effect types: effect_types.md
      - API:
          - Index: api.md
          - Conventions & return values: conventions.md
          - Variants & files: api_variants.md
          - Effects: api_effects.md
          - Phasing & germline: api_phasing.md
          - RNA & transcripts: api_rna.md
          - ORFs: api_orfs.md
          - Sample identity: api_sample_identity.md
          - Annotators: api_annotators.md
      - Writing an annotator: annotator_contract.md
  - Project:
      - Changelog: changelog.md
      - API & documentation maintenance: dev/api-quality.md

markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
  - pymdownx.superfences
  - tables

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
            show_signature_annotations: true
            members_order: source
            docstring_style: numpy
            docstring_section_style: spacy
            merge_init_into_class: true
